<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site de Músicas</title>
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/musicas.css">
  <link rel="stylesheet" href="./css/playlists.css">
  <link rel="stylesheet" href="./css/player.css">
</head>
<body>
  <header>
    <h1>Site de Músicas</h1>
    <nav>
      <button data-tela="musicas" class="ativo">Músicas</button>
      <button data-tela="playlists">Playlists</button>
    </nav>
  </header>

  <main>
    <section id="tela-musicas"></section>
    <section id="tela-playlists" hidden></section>
  </main>

  <!-- Player fixo (Pessoa 3 monta os botões em js/player.js) -->
  <footer id="player">
    <span id="player-nome">Nenhuma música tocando</span>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
